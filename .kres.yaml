---
kind: common.Image
name: image-omni_exporter
spec:
  extraEnvironment:
    PLATFORM: linux/amd64,linux/arm64
---
kind: golang.Build
spec:
  outputs:
    linux-amd64:
      GOOS: linux
      GOARCH: amd64
    linux-arm64:
      GOOS: linux
      GOARCH: arm64
---
kind: golang.Generate
spec:
  versionPackagePath: internal/version
---
kind: service.CodeCov
spec:
  enabled: false
---
kind: auto.Helm
spec:
  enabled: true
  chartDir: deploy/helm/omni-exporter
  schemaDisabled: true
  chartVersionMajor: 0
  template:
    valuesFiles:
      - hack/test/helm/template-values.yaml
